<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보정 처리대</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:36 22% 97%; --fg:24 12% 11%; --card:0 0% 100%;
  --mut:34 16% 94%; --mutf:26 8% 46%; --line:32 16% 89%; --line2:32 14% 82%;
  --pri:347 68% 34%; --prif:0 0% 100%; --pris:346 46% 96%;
  --ok:158 72% 28%; --oks:152 46% 94%;
  --warn:30 88% 40%; --warns:36 78% 94%;
  --bad:2 68% 46%; --bads:2 70% 96%;
  --r:10px; --rs:7px;
  --fh:"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
  --fm:"IBM Plex Mono","Noto Sans KR",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:26 10% 9%; --fg:36 18% 93%; --card:26 9% 13%;
  --mut:26 8% 18%; --mutf:30 8% 60%; --line:26 8% 22%; --line2:26 8% 30%;
  --pri:347 58% 60%; --prif:26 10% 9%; --pris:347 26% 21%;
  --ok:158 52% 48%; --oks:158 30% 17%;
  --warn:34 76% 58%; --warns:34 36% 18%;
  --bad:2 66% 62%; --bads:2 38% 19%;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:26 10% 9%; --fg:36 18% 93%; --card:26 9% 13%;
  --mut:26 8% 18%; --mutf:30 8% 60%; --line:26 8% 22%; --line2:26 8% 30%;
  --pri:347 58% 60%; --prif:26 10% 9%; --pris:347 26% 21%;
  --ok:158 52% 48%; --oks:158 30% 17%;
  --warn:34 76% 58%; --warns:34 36% 18%;
  --bad:2 66% 62%; --bads:2 38% 19%;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:hsl(var(--bg));color:hsl(var(--fg));font-family:var(--fh);
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;font-family:inherit}
input,textarea,select{font:inherit;font-family:inherit}
.m{font-family:var(--fm);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid hsl(var(--pri));outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 앱바 */
.bar{position:sticky;top:0;z-index:40;background:hsl(var(--card));border-bottom:1px solid hsl(var(--line))}
.bar1{max-width:1280px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.bar1 h1{font-size:15.5px;font-weight:900}
.bar2{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.bar2 button{padding:9px 15px 11px;border:0;border-bottom:2.5px solid transparent;background:transparent;
  font-size:13.5px;font-weight:700;color:hsl(var(--mutf));white-space:nowrap;display:flex;align-items:center;gap:7px}
.bar2 button:hover{color:hsl(var(--fg))}
.bar2 button.on{color:hsl(var(--pri));border-bottom-color:hsl(var(--pri))}
.bar2 .n{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:hsl(var(--mut));
  color:hsl(var(--mutf));font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--fm)}
.bar2 button.on .n{background:hsl(var(--pri));color:hsl(var(--prif))}
main{max-width:1280px;margin:0 auto;padding:20px 20px 80px}

/* 기본 조각 */
.card{background:hsl(var(--card));border:0;border-radius:18px;
  box-shadow:0 1px 2px hsl(24 12% 11%/.04),0 8px 24px hsl(24 12% 11%/.045)}
:root[data-theme="dark"] .card,
:root:not([data-theme="light"]) .card{box-shadow:0 1px 2px hsl(0 0% 0%/.3),0 8px 24px hsl(0 0% 0%/.22)}
.sub-card{background:hsl(var(--mut)/.5);border:1px solid hsl(var(--line));border-radius:14px;overflow:hidden}
.needbox{margin:14px 0;padding:14px 16px;border-radius:14px;background:hsl(var(--mut)/.55)}
.needbox.wait{background:hsl(var(--warns)/.45)}
.needbox.ok{background:hsl(var(--oks)/.45)}
.steps{margin-top:6px}
.pad{padding:20px}
.hd{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid hsl(var(--line));flex-wrap:wrap}
.hd h3{font-size:14.5px;font-weight:800}
.sp{flex:1}
.dim{color:hsl(var(--mutf));font-size:12.5px;line-height:1.7}
.cap{font-size:11px;font-weight:800;letter-spacing:.09em;color:hsl(var(--mutf))}
.tag{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:5px;
  font-size:11.5px;font-weight:700;background:hsl(var(--mut));color:hsl(var(--mutf));white-space:nowrap}
.tag.p{background:hsl(var(--pris));color:hsl(var(--pri))}
.tag.g{background:hsl(var(--oks));color:hsl(var(--ok))}
.tag.y{background:hsl(var(--warns));color:hsl(var(--warn))}
.tag.r{background:hsl(var(--bads));color:hsl(var(--bad))}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;
  border-radius:var(--rs);border:1px solid transparent;font-size:13px;font-weight:700;white-space:nowrap;transition:.12s}
.b.p{background:hsl(var(--pri));color:hsl(var(--prif))}
.b.p:hover{filter:brightness(1.1)}
.b.o{border-color:hsl(var(--line2))}
.b.o:hover{background:hsl(var(--mut))}
.b.g{color:hsl(var(--mutf));font-weight:600}
.b.g:hover{background:hsl(var(--mut));color:hsl(var(--fg))}
.b.s{height:28px;padding:0 10px;font-size:12px}
.b.lg{height:56px;font-size:16px;font-weight:800;width:100%;border-radius:14px}
.b:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;padding:8px 11px;border:1px solid hsl(var(--line2));border-radius:var(--rs);
  background:hsl(var(--card));color:hsl(var(--fg));font-size:13px}
.in:focus{outline:2px solid hsl(var(--pri)/.3);border-color:hsl(var(--pri))}
textarea.in{line-height:1.8;resize:vertical}
.bar-p{height:6px;border-radius:99px;background:hsl(var(--mut));overflow:hidden}
.bar-p i{display:block;height:100%;background:hsl(var(--ok));transition:width .3s}
.bar-p.y i{background:hsl(var(--warn))} .bar-p.r i{background:hsl(var(--bad))}
.ck{flex:none;width:20px;height:20px;border-radius:5px;border:1.6px solid hsl(var(--line2));
  background:hsl(var(--card));display:grid;place-items:center;font-size:12px;color:transparent;cursor:pointer}
.ck.on{background:hsl(var(--pri));border-color:hsl(var(--pri));color:hsl(var(--prif))}
.ck.lock{border-style:dashed;cursor:not-allowed;background:hsl(var(--mut))}
.empty{padding:26px 14px;text-align:center;color:hsl(var(--mutf));font-size:13px;line-height:1.8}
.rows>*+*{border-top:1px solid hsl(var(--line))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr!important}}

/* A. 오늘 */
body.docmode main{max-width:1440px}
body.docmode .bar1 h1{font-size:16px}
.alrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.alrow label{display:flex;align-items:center;gap:7px;font-size:12.8px;font-weight:700;cursor:pointer}
.pastbox{margin-top:12px;padding:14px 16px;border-radius:14px;background:hsl(var(--mut)/.5)}
.paper.past{max-height:260px;padding:20px 22px;font-size:12.8px;line-height:1.95;margin-top:6px;box-shadow:none;border:1px solid hsl(var(--line))}
.peekwrap{position:fixed;inset:0;z-index:70;background:hsl(24 12% 11%/.45);
  display:grid;place-items:center;padding:24px}
.peek{width:min(880px,94vw);margin:0;border-radius:14px;overflow:hidden;border:1px solid hsl(var(--line));background:hsl(var(--card))}
.peekh{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid hsl(var(--line));background:hsl(var(--mut)/.6)}
.peekb{max-height:460px;overflow:auto;display:grid;place-items:center;background:hsl(var(--mut)/.35)}
.peekb img{max-width:100%;display:block}
.peekb iframe{width:100%;height:460px;border:0;display:block}
/* 2026-09-03 : 사건 고르기 창 */
.wbwrap{position:fixed;inset:0;z-index:75;background:hsl(24 12% 11%/.5);display:grid;place-items:center;padding:24px}
.wbbox{width:min(760px,95vw);max-height:86vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid hsl(var(--line));background:hsl(var(--card));box-shadow:0 24px 60px hsl(24 12% 11%/.28)}
.wbh{padding:16px 20px 12px;border-bottom:1px solid hsl(var(--line))}
.wbh h3{font-size:18px;font-weight:800;margin:0 0 3px}
.wbh .dim{font-size:12.5px}
.wbnow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;padding:10px 13px;border-radius:11px;background:hsl(var(--mut)/.6);font-size:12.8px}
.wbwarn{margin-top:9px;padding:11px 14px;border-radius:11px;font-size:13px;line-height:1.7;background:hsl(4 70% 96%);color:hsl(4 60% 32%);border:1px solid hsl(4 60% 86%)}
.wbok{margin-top:9px;padding:9px 13px;border-radius:11px;font-size:12.8px;background:hsl(150 45% 95%);color:hsl(150 45% 26%);border:1px solid hsl(150 40% 84%)}
.wbsearch{padding:12px 20px 0}
.wblist{padding:8px 14px 14px;overflow:auto;flex:1;min-height:120px}
.wbrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.12s}
.wbrow:hover{background:hsl(var(--mut)/.7);border-color:hsl(var(--line2))}
.wbrow.on{background:hsl(var(--pri)/.09);border-color:hsl(var(--pri)/.45);cursor:default}
.wbrow .who{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.wbrow .meta{font-size:12.3px;color:hsl(var(--mutf));margin-top:3px;line-height:1.6}
.wbrow .go{flex:none;font-size:12.5px;font-weight:800;color:hsl(var(--pri))}
.wbf{padding:12px 20px;border-top:1px solid hsl(var(--line));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 2026-09-05 : 의뢰인 목록 첫 화면 */
.hmwrap{max-width:920px;margin:0 auto;padding:26px 20px 60px}
.hmh{margin-bottom:18px}
.hmh h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.hmh .dim{font-size:13.5px}
.hmnew{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 18px;border-radius:14px;border:1px dashed hsl(var(--line2));cursor:pointer;margin-bottom:14px;transition:.12s}
.hmnew:hover{background:hsl(var(--mut)/.6);border-color:hsl(var(--pri)/.5)}
.hmnew b{font-size:15px;font-weight:800}
.hmcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 18px;border-radius:14px;border:1px solid hsl(var(--line));background:hsl(var(--card));cursor:pointer;margin-bottom:9px;transition:.12s}
.hmcard:hover{border-color:hsl(var(--pri)/.55);background:hsl(var(--mut)/.4);transform:translateY(-1px)}
.hmcard .nm{font-size:17px;font-weight:800;letter-spacing:-.01em}
.hmcard .mt{font-size:12.5px;color:hsl(var(--mutf));margin-top:4px;line-height:1.65}
.hmcard .go{flex:none;font-size:13px;font-weight:800;color:hsl(var(--pri))}
.crumb{display:flex;align-items:center;gap:6px}
.crumb button{background:none;border:0;padding:2px 6px;border-radius:7px;font:inherit;font-size:14px;font-weight:700;color:hsl(var(--mutf));cursor:pointer}
.crumb button:hover{background:hsl(var(--mut));color:hsl(var(--fg))}
.crumb span.sep{color:hsl(var(--mutf));font-size:13px}
.fchip a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.fig{font-size:40px;font-weight:900;letter-spacing:-.03em;font-family:var(--fm);font-variant-numeric:tabular-nums}
.figu{font-size:15px;font-weight:700;color:hsl(var(--mutf))}
.ckgrp{padding:4px 0}
.ckh{display:flex;align-items:center;gap:8px;padding:11px 16px 6px;flex-wrap:wrap}
.ckh b{font-size:13.6px;font-weight:800}
.ckrow{display:flex;align-items:flex-start;gap:11px;padding:8px 16px 8px 44px;font-size:13.5px;cursor:pointer}
.ckrow:hover{background:hsl(var(--mut)/.55)}
.ckrow.done{opacity:.5}
.ckrow.done>span:not(.ck){text-decoration:line-through}
@media print{
  .bar,.b,.msgcard{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
}
.msgcard textarea.msgta{min-height:260px;font-size:13px;line-height:1.85;background:hsl(var(--mut)/.4)}
.secttl{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.secttl h2{font-size:16.5px;font-weight:900}
.card.soft{background:hsl(var(--mut)/.5)}
.msgbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid hsl(var(--line));background:hsl(var(--warns)/.35)}
.qrow .no{width:auto;min-width:26px;font-size:11px}
.hero{background:hsl(var(--card));border:1px solid hsl(var(--line));border-radius:var(--r);
  box-shadow:0 1px 2px hsl(24 12% 11%/.04),0 8px 24px hsl(24 12% 11%/.05);overflow:hidden;margin-bottom:14px}
.hero .top{display:flex;align-items:center;gap:9px;padding:11px 18px;background:hsl(var(--mut)/.6);
  border-bottom:1px solid hsl(var(--line));flex-wrap:wrap}
.hero .bd{padding:24px 26px 26px}
.hero h2{font-size:25px;font-weight:900;line-height:1.35}
.hero .sub{margin-top:5px;color:hsl(var(--mutf));font-size:13px}
.how{margin:18px 0;padding:16px 18px;background:hsl(var(--mut)/.55);border-radius:var(--rs)}
.how ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.stepl{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid hsl(var(--line))}
.stepl:last-child{border-bottom:0}
.stepl.done span.t{opacity:.42;text-decoration:line-through}
.stepl.flash{background:hsl(var(--bads)/.7);border-radius:var(--rs);animation:sh .45s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.drop{border:1.5px dashed hsl(var(--line2));border-radius:var(--rs);padding:14px;text-align:center;
  color:hsl(var(--mutf));font-size:12.5px;margin-top:14px}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left;
  border:0;background:transparent}
.qrow:hover{background:hsl(var(--mut)/.7)}
.qrow .no{width:22px;color:hsl(var(--mutf));font-size:12px;font-weight:800;font-family:var(--fm)}
.qrow b{font-size:13.3px;font-weight:700}
.qrow.fresh{background:hsl(var(--oks)/.75)}
.notice{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:13px 16px;margin-bottom:14px;
  border-radius:var(--r);background:hsl(var(--oks));border:1px solid hsl(var(--ok)/.35);color:hsl(var(--ok))}
.notice b{font-size:15px;font-weight:900}

/* B. 사건 */
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:14px;position:relative;padding-bottom:14px}
.tli:not(:last-child)::before{content:"";position:absolute;left:14px;top:32px;bottom:0;width:2px;background:hsl(var(--line))}
.tli.done:not(:last-child)::before{background:hsl(var(--ok)/.45)}
.dot{flex:none;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;z-index:1;
  background:hsl(var(--mut));color:hsl(var(--mutf));font-size:12px;font-weight:800;font-family:var(--fm);
  border:2px solid hsl(var(--bg))}
.tli.done .dot{background:hsl(var(--ok));color:hsl(var(--card))}
.tli.now .dot{background:hsl(var(--pri));color:hsl(var(--prif))}
.tlb{flex:1;min-width:0;background:hsl(var(--card));border:1px solid hsl(var(--line));border-radius:var(--r);padding:14px 16px}
.tli.now .tlb{border-color:hsl(var(--pri)/.35)}
.hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px}
.hrow:hover{background:hsl(var(--mut)/.6)}
.hno{flex:none;width:20px;height:20px;border-radius:99px;border:2px solid hsl(var(--line2));display:grid;place-items:center;font-size:11px}
.hrow.ok .hno{background:hsl(var(--ok));border-color:hsl(var(--ok));color:hsl(var(--card))}
.hbody{padding:0 14px 14px 44px}
.chain{display:flex;flex-direction:column}
.cn{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.cn+.cn{border-top:1px solid hsl(var(--line))}
.cnum{flex:none;width:21px;height:21px;border-radius:99px;display:grid;place-items:center;font-size:11px;
  font-weight:800;font-family:var(--fm);background:hsl(var(--mut));color:hsl(var(--mutf));margin-top:1px}
.cn.ok .cnum{background:hsl(var(--ok));color:hsl(var(--card))}
.cn.ok b{opacity:.55;text-decoration:line-through}
.mrow{display:flex;gap:11px;align-items:flex-start;padding:12px 14px}
.mrow.full{background:hsl(var(--oks)/.4)}
.mrow.sent{background:hsl(var(--mut)/.55)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 9px;border-radius:5px;
  background:hsl(var(--mut));font-size:11.5px;font-weight:600;margin:3px 4px 0 0}
.fchip button{border:0;background:hsl(var(--line));border-radius:4px;min-width:19px;height:19px;padding:0 4px;font-size:11px;font-weight:700;white-space:nowrap;
  display:grid;place-items:center;color:hsl(var(--mutf))}
.fchip button:hover{background:hsl(var(--bad));color:#fff}

/* C. 보정서 */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.paper{background:hsl(var(--card));border:1px solid hsl(var(--line));border-radius:var(--r);
  padding:34px 38px;font-size:13.5px;line-height:2.1;white-space:pre-wrap;
  min-height:420px;max-height:72vh;overflow:auto;box-shadow:0 1px 3px hsl(24 12% 11%/.05)}
.paper .t{display:block;text-align:center;font-size:19px;font-weight:900;letter-spacing:.5em;
  text-indent:.5em;margin-bottom:24px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:var(--rs);font-size:13px}
.chk.pass{background:hsl(var(--oks)/.65);color:hsl(var(--ok))}
.chk.fail{background:hsl(var(--bads)/.75);color:hsl(var(--bad))}
.chk .ic{flex:none;font-weight:900;width:15px}
.seg{display:inline-flex;border:1px solid hsl(var(--line2));border-radius:var(--rs);overflow:hidden}
.seg button{height:30px;padding:0 12px;border:0;background:hsl(var(--card));font-size:12.5px;font-weight:700;
  color:hsl(var(--mutf));border-right:1px solid hsl(var(--line))}
.seg button:last-child{border-right:0}
.seg button.on{background:hsl(var(--pri));color:hsl(var(--prif))}
.pickrow{display:flex;gap:10px;align-items:center;padding:9px 12px;font-size:13px}
.pickrow.lock{background:hsl(var(--mut)/.6);color:hsl(var(--mutf))}
.pickrow.no{opacity:.6}
.pickrow.off{background:hsl(var(--mut)/.45)}
.linkto{font-size:11.5px;margin-top:4px;color:hsl(var(--pri));font-weight:700}
.pickrow.off .linkto{color:hsl(var(--bad))}
.linkto .y{color:hsl(var(--ok));margin-right:8px}
.linkto .n{color:hsl(var(--mutf));margin-right:8px;font-weight:500}

/* D. 배분 */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(198px,1fr));gap:11px}
.lane{background:hsl(var(--card));border:1px solid hsl(var(--line));border-radius:var(--r);display:flex;flex-direction:column}
.lh{padding:11px 12px;border-bottom:1px solid hsl(var(--line))}
.lb{padding:8px;display:flex;flex-direction:column;gap:7px}
.tk{border:1px solid hsl(var(--line));border-radius:var(--rs);padding:9px 10px;text-align:left;width:100%;background:hsl(var(--card))}

/* ── 기본 ─────────────────────────────── */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function T(id){for(var i=0;i<D.tasks.length;i++)if(D.tasks[i].id===id)return D.tasks[i];return null;}
function cnt(t){var s=t.steps||[],d=0;s.forEach(function(x){if(x.done)d++;});return{d:d,n:s.length};}
/* 2026-08-31 혜림 : 체크만 했다고 끝난 게 아닙니다.
   체크를 다 하고 [다 했어요] 를 눌러야 끝난 것으로 봅니다. */
function allTicked(t){var c=cnt(t);return c.n>0&&c.d===c.n;}
function isDone(t){return !!t.finished;}
function pct(a,b){return b?Math.round(a/b*100):0;}
function toast(m){var e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e);}
  e.textContent=m;e.className="on";clearTimeout(window._tt);window._tt=setTimeout(function(){e.className="";},2800);}
function kb(n){return n<1024?n+"B":(n<1048576?Math.round(n/1024)+"KB":(n/1048576).toFixed(1)+"MB");}
function kor(s){if(!s)return"";var d=new Date(s+"T00:00:00");return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+".";}
function biz(s){if(!s)return"";var d=new Date(s+"T00:00:00");while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
function addDays(s,n){var d=s?new Date(s+"T00:00:00"):new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function today(){return new Date().toISOString().slice(0,10);}

/* ── 자료 ─────────────────────────────── */
var MT={"파일":{need:"파일",step:["요청전","요청함","받음"]},
        "진술":{need:"진술",step:["요청전","물어봄","들음"]},
        "진술+파일":{need:"둘다",step:["요청전","요청함","받음"]},
        "우리작성":{need:"파일",step:["대기","만드는 중","다 만듦"]},
        "확인":{need:"없음",step:["요청전","요청함","확인됨"]}};
function mt(a){return MT[a.ty]||MT["파일"];}
function MATS(){var o=[];D.tasks.forEach(function(t){(t.steps||[]).forEach(function(s,i){
  if(!s.provides)return; if(!s.mat)s.mat={status:"요청전",files:[],memo:"",say:"",round:0,pick:true};
  o.push({key:s.provides,task:t,step:s,mat:s.mat,ty:s.mat_type||"파일",why:s.mat_why||""});});});return o;}
function M(k){var l=MATS();for(var i=0;i<l.length;i++)if(l[i].key===k)return l[i];return null;}
function full(a){
  if(a.step.from_accounts&&D.accounts){var r=D.accounts.rows;if(r.length&&r.every(function(x){return x.got;}))return true;}
  var n=mt(a).need,f=(a.mat.files||[]).length>0,s=String(a.mat.say||"").trim().length>0;
  if(n==="파일")return f; if(n==="진술")return s; if(n==="둘다")return f&&s; return true;
}
function lack(a){if(full(a))return[];var n=mt(a).need,o=[];
  if((n==="파일"||n==="둘다")&&!(a.mat.files||[]).length)o.push("파일");
  if((n==="진술"||n==="둘다")&&!String(a.mat.say||"").trim())o.push("진술 내용");return o;}
function got(k){var a=M(k);return !!(a&&full(a));}
function miss(t){return (t.needs||[]).filter(function(k){return !got(k);});}
function ready(t){if(isDone(t))return false;if(miss(t).length)return false;
  return !(t.blocked_by||[]).some(function(id){var b=T(id);return b&&!isDone(b);});}
function unlocks(k){return D.tasks.filter(function(t){return !isDone(t)&&(t.needs||[]).indexOf(k)>=0&&!miss(t).length;});}

function setStat(k,st){var a=M(k);if(!a)return;var was=got(k);a.mat.status=st;
  if(st===mt(a).step[2]){a.step.done=true;}
  after(k,was);}
function after(k,was){
  if(!was&&got(k)){var u=unlocks(k).filter(ready);justNew={};u.forEach(function(x){justNew[x.id]=1;});
    if(u.length)notice={k:k,ids:u.map(function(x){return x.id;})};
    toast(k+" 확보"+(u.length?" · "+u.length+"건 시작 가능":""));}
  draw();}
function addF(k,inp){var a=M(k);if(!a)return;var was=got(k);
  /* 2026-08-31 : 파일 원본을 이 브라우저에 함께 저장한다. 새로고침해도 [보기]가 그대로 된다 */
  var jobs=[];
  for(var i=0;i<inp.files.length;i++){
    var f=inp.files[i], u="";
    var fid="f"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
    try{ u=URL.createObjectURL(f); }catch(e){}
    var _e1={name:f.name,size:f.size,url:u,type:f.type||"",fid:fid,at:new Date().toISOString()};
    a.mat.files.push(_e1);
    jobs.push(idbPut("files",fid,f));
    jobs.push(cloudPutFile(f,fid).then(function(p){ if(p)_e1.spath=p; }).catch(function(){}));
  }
  if(full(a))a.mat.status=mt(a).step[2];
  Promise.all(jobs).then(function(){ markSave(); })
    .catch(function(){ toast("파일을 저장하지 못했습니다. 이름만 남습니다"); saveDot("파일 저장 실패","r"); });
  after(k,was);}
var peekAt=null;
function peek(k,i){ peekAt=(peekAt&&peekAt.k===k&&peekAt.i===i)?null:{k:k,i:i}; draw(); }
function peekBox(){
  if(!peekAt) return "";
  var f;
  if(peekAt.tid){ var tk=T(peekAt.tid); f=tk&&(tk.files||[])[peekAt.i]; }
  else { var a=M(peekAt.k); f=a&&(a.mat.files||[])[peekAt.i]; }
  if(!f||!f.url) return "";
  var img=/^image\//.test(f.type), pdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
  var body = img ? '<img src="'+f.url+'" alt="'+esc(f.name)+'">'
           : pdf ? '<iframe src="'+f.url+'" title="'+esc(f.name)+'"></iframe>'
           : '<div class="empty">이 형식은 화면 안에서 못 봅니다.<br>한글(hwp)이나 엑셀은 새 창으로 열어 확인하세요.<br><br>'
             +'<a class="b o" style="width:auto;height:40px;padding:0 16px;text-decoration:none" href="'+f.url+'" target="_blank" rel="noopener">새 창으로 열기</a></div>';
  return '<div class="peekwrap" onclick="if(event.target===this){peekAt=null;draw()}"><div class="peek"><div class="peekh"><b>'+esc(f.name)+'</b><span class="dim">'+kb(f.size)+'</span>'
    +'<span class="sp"></span><button class="b g s" onclick="peekAt=null;draw()">닫기</button></div>'
    +'<div class="peekb">'+body+'</div></div></div>';
}
function delF(k,i){var a=M(k);var f=(a.mat.files||[])[i];
  if(f&&f.fid)idbDel("files",f.fid);
  if(f&&f.url){try{URL.revokeObjectURL(f.url);}catch(e){}}
  a.mat.files.splice(i,1);draw();}
function say(k,v){var a=M(k);if(!a)return;var was=got(k);a.mat.say=v;
  var c=document.getElementById("sc-"+cid(k));if(c)c.textContent=v.length+"자";
  if(full(a)&&a.mat.status!==mt(a).step[2]){a.mat.status=mt(a).step[2];after(k,was);}}
function cid(s){return String(s).replace(/[^0-9A-Za-z가-힣]/g,"");}
function memo(k,v){var a=M(k);if(a){a.mat.memo=v;markSave();}}
function tickAcct(i){var r=D.accounts.rows[i];var was=got("은행거래내역서 13개");r.got=!r.got;
  var a=M("은행거래내역서 13개");if(a&&full(a))a.mat.status="받음";after("은행거래내역서 13개",was);}

/* ── 항 ───────────────────────────────── */
function hTasks(h){return (h.tasks||[]).map(T).filter(Boolean);}
function hMats(h){var s={};hTasks(h).forEach(function(t){
  (t.steps||[]).forEach(function(x){if(x.provides)s[x.provides]=1;});
  (t.needs||[]).forEach(function(k){s[k]=1;});});
  return Object.keys(s).map(M).filter(Boolean);}
function hChain(h){var o=[];
  hTasks(h).forEach(function(t){var c=cnt(t);
    o.push({label:t.title,ok:isDone(t),sub:t.station+" "+t.station_name+(c.n?" · "+c.d+"/"+c.n:"")});});
  hMats(h).forEach(function(a){
    o.push({label:a.key,ok:full(a),sub:a.ty+(lack(a).length?" · "+lack(a).join(", ")+" 없음":"")});});
  return o;}
function hDone(h){var c=hChain(h);return c.length&&c.every(function(x){return x.ok;});}
/* 이번 차수에 넣을 항인가. 자동이 기본, 사람이 끄고 켤 수 있다 */
function hAuto(h){
  if(h.round)return false;
  var live=h.docs.filter(function(d){
    if(d.only_if_receipt&&!h.receipt_required)return false;
    if(!d.mat)return hDone(h);
    var a=M(d.mat);return a&&full(a)&&!a.mat.round&&a.mat.pick!==false;});
  if(live.length)return true;
  if(h.say&&hDone(h))return true;
  return !h.docs.length&&hDone(h);
}
function hPick(h){return h.round?false:(h.pick===undefined?hAuto(h):!!h.pick);}
function hDocs(h){
  return h.docs.filter(function(d){
    if(d.only_if_receipt&&!h.receipt_required)return false;
    if(!d.mat)return true;
    var a=M(d.mat);return a&&full(a)&&!a.mat.round&&a.mat.pick!==false;}).map(function(d){return d.name;});
}
/* 이 자료가 어느 법원 문항에 쓰이나 */
function matHangs(key){
  return (D.hangs||[]).filter(function(h){
    return (h.docs||[]).some(function(d){return d.mat===key;});
  });
}
/* 이 항이 지금 들어가는 근거가 된 자료들 */
function hangSrc(h){
  return (h.docs||[]).filter(function(d){return d.mat;}).map(function(d){
    var a=M(d.mat); return {key:d.mat, name:d.name, on:!!(a&&full(a)&&!a.mat.round&&a.mat.pick!==false)};
  });
}
function josa(n){var s=String(n||"").replace(/\([^)]*\)/g,"").replace(/\s+$/,"");
  var c=s.charCodeAt(s.length-1);
  if(isNaN(c)||c<0xAC00||c>0xD7A3)return "를";
  return ((c-0xAC00)%28)?"을":"를";}
function fill(s){return String(s||"").replace(/\{\{([^}]+)\}\}/g,function(_,k){
  var a=M(k.trim());return (a&&String(a.mat.say||"").trim())?a.mat.say:"(아직 당사자 진술을 못 들었습니다)";});}

/* ── 차수 ─────────────────────────────── */
function cur(){var r=D.rounds;for(var i=0;i<r.length;i++)if(!r[i].submitted_at)return r[i];return null;}
function sendable(){return MATS().filter(function(a){return full(a)&&!a.mat.round;});}
function willSend(){return sendable().filter(function(a){return a.mat.pick!==false;});}
function held(){return sendable().filter(function(a){return a.mat.pick===false;});}
function notyet(){return MATS().filter(function(a){return !full(a);});}
function sent(n){return MATS().filter(function(a){return a.mat.round&&(!n||a.mat.round===n);});}

/* ── 보정서 본문 ───────────────────────── */
function body(){
  /* 보정 3-1 과 3-2 처럼 같은 법원 문항이면 한 줄로 합친다.
     법원은 3항 하나로 봤는데 우리가 둘로 쪼갠 것뿐이다. */
  var hs=D.hangs.filter(hPick), grp=[], idx={};
  hs.forEach(function(h){
    if(idx[h.court_no]===undefined){ idx[h.court_no]=grp.length; grp.push({no:h.court_no,docs:[],says:[]}); }
    var g=grp[idx[h.court_no]];
    hDocs(h).forEach(function(d){ if(g.docs.indexOf(d)<0) g.docs.push(d); });
    if(h.say) g.says.push(fill(h.say));
  });
  grp.sort(function(a,b){return a.no-b.no;});
  /* 2026-09-05 : 이미 낸 것을 법원에 밝히는 문단. D.predone 이 있으면 맨 앞에 붙는다 */
  var pre="";
  var P=D.predone;
  if(P&&P.pick!==false&&P.items&&P.items.length){
    pre = (P.title||"이미 제출한 사항")+"\n";
    if(P.intro)pre += "   "+P.intro+"\n";
    P.items.forEach(function(x){ pre += "   "+String(x).split("\n").join("\n   ")+"\n"; });
    pre += "\n";
  }
  var out=pre,lastDoc=null,anyDoc=false;
  grp.forEach(function(g,i){
    var line=(i+1)+". 보정권고"+g.no+"항.";
    if(g.docs.length){ line+=" "+g.docs.join(", "); anyDoc=true; lastDoc=g.docs[g.docs.length-1]; }
    out+=line+"\n";
    g.says.forEach(function(s){ out+="   "+s.split("\n").join("\n   ")+"\n"; });
    out+="\n";
  });
  if(anyDoc) out+=josa(lastDoc)+" 제출합니다.\n\n";
  return out;
}
function tail(){
  var h=held(), n=notyet(), r=cur();
  if(!h.length&&!n.length) return D.submit.closing_all+"\n";
  var s="";
  if(r&&r.mode==="fact") s+="나머지 자료는 "+(r.fact_note||"사실조회촉탁 회신")+"이 도착하는 대로 지체 없이 제출하겠습니다.\n\n";
  else if(r&&r.promise) s+="나머지 자료는 "+kor(r.promise)+"까지 제출하겠습니다.\n\n";
  var R=D.delay_reasons.filter(function(x){return x.key===D.submit.reason_key;})[0];
  var base=R?(R.t[D.submit.tone]||""):"";
  if(D.submit.reason_key==="직접입력") base=D.submit.free||"";
  if(D.submit.len==="짧게") base=base.split(". ")[0]+(base?".":"");
  if(D.submit.len==="길게") base=base+" 남은 자료를 신속히 갖추어 위 기일까지 반드시 제출하겠습니다.";
  if(base) s+=base+"\n";
  return s;
}

  var r=cur(); if(!r)return;
  r.submitted_at=D.submit.date||today();
  r.body=fullDoc().split(String.fromCharCode(0)).join("\n\n");
  r.att=attList();
  r.left=notyet().concat(held()).map(function(a){return a.key;});

  willSend().forEach(function(a){a.mat.round=r.no;});
  D.hangs.filter(hPick).forEach(function(h){h.round=r.no;h.pick=undefined;});
  var left=notyet().length+held().length;
  if(left&&r.mode==="fact"){
    D.submit.date="";
    toast(r.label+" 제출. 나머지는 "+(r.fact_note||"회신")+" 도착 후 다음 차수를 만듭니다");

    D.rounds.push({no:r.no+1,label:(r.no+1)+"차",deadline:r.promise,submitted_at:"",promise:"",status:"준비중"});

/* 여섯 갈래로 나눠서 한 화면에 다 보이게 한다.
   위 세 줄은 "지금 무엇을 할 수 있나"(상태), 아래 세 줄은 "누가 무엇을"(성격). */
function groups(){
  var g={now:[],unlocked:[],waiting:[],client:[],issue:[],chart:[]};
  D.tasks.forEach(function(t){
    if(isDone(t)) return;
    if(who!=="전체" && t.assignee!==who) return;
    var need=(t.needs||[]).length;
    if(ready(t)){
      if(t.owner==="당사자") g.client.push(t);
      else if(need) g.unlocked.push(t);
      else g.now.push(t);
    }else if(miss(t).length){
      g.waiting.push(t);
    }else if(t.owner==="당사자"){
      g.client.push(t);
    }
    /* 성격별 (겹쳐도 됨) */
    if(t.owner==="사무실" && (t.station==="P2"||t.kind==="발급"||t.kind==="작성")) g.issue.push(t);
    if(t.owner==="공동") g.chart.push(t);
  });
  Object.keys(g).forEach(function(k){ g[k].sort(function(a,b){return a.order-b.order;}); });
  return g;
}

      +"2. 국민건강보험공단 체납액 완납\n   완납 후 영수증 사진을 보내주세요.\n\n"
      +"이 두 가지는 법원 기한과 직결되는 부분이라 늦어지면 절차가 흔들립니다.\n"
      +"나머지 서류는 준비되는 대로 천천히 보내주셔도 괜찮습니다.\n"+close;
  }
  if(k===4){
    return open+"아래 서류만 파일로 보내주시면 됩니다.\n\n"
      +blockFiles()+blockAccts()
      +(files.length||accts.length?"":"■ 지금 받을 서류가 없습니다.\n\n")
      +"사진보다 원본 파일(PDF·엑셀)이 좋습니다.\n"+close;
  }
  if(k===5){
    return open+"아래 내용만 카톡으로 알려주시면 됩니다.\n\n"
      +blockSays()+blockBoth()
      +(says.length||both.length?"":"■ 지금 여쭤볼 것이 없습니다.\n\n")
      +"기억나는 대로 적어주시면 저희가 정리합니다. 길게 안 쓰셔도 됩니다.\n"+close;
  }
  if(k===6){
    var when = (r&&r.mode==="fact") ? (r.fact_note||"사실조회촉탁 회신")+"이 오는 대로"
             : (r&&r.promise) ? kor(r.promise)+"까지" : "다음 기한까지";
    return open
      +"오늘 준비된 자료로 법원에 먼저 제출했습니다.\n"
      +"나머지 자료는 "+when+" 제출하겠다고 법원에 말씀드렸습니다.\n\n"
      +(reqs.length||accts.length?"그때까지 아래 자료만 보내주시면 됩니다.\n\n":"")
      +blockFiles()+blockAccts()+blockSays()+blockBoth()
      +"이 날짜가 새 기한이 됩니다. 늦어지면 절차가 흔들리니 그전까지 꼭 부탁드립니다.\n"+close;
  }
  var head = k===1
    ? "법원 보정 자료 요청드립니다.\n"+dueLine()
    : "아직 못 받은 것만 정리했습니다.\n"+dueLine();
  var s=open+head+blockFiles()+blockAccts()+blockSays()+blockBoth();
  if(!files.length&&!accts.length&&!says.length&&!both.length) s+="■ 필요한 자료를 모두 받았습니다. 감사합니다.\n\n";
  return s+close;
}

function tick(id,j){
  var t=T(id);t.steps[j].done=!t.steps[j].done;flashId=null;
  openTask=id;              /* 체크했다고 다음 카드로 넘어가지 않습니다 */
  markSave(); draw();
}
function finish(id){
  var t=T(id),c=cnt(t);
  /* 이미 끝낸 것을 다시 누르면 되돌립니다 */
  if(t.finished){ t.finished=false; markSave(); toast(t.title+" 다시 열었습니다"); draw(); return; }
  if(c.d<c.n){
    var j=-1;(t.steps||[]).forEach(function(s,k){if(!s.done&&j<0)j=k;});
    flashId=id+"-"+(j<0?0:j); draw();
    setTimeout(function(){flashId=null;draw();},900);
    toast("아직 "+(c.n-c.d)+"개가 남았어요. 다 체크한 뒤에 눌러 주세요"); return;
  }
  t.finished=true; openTask=null; markSave();
  toast("잘하셨어요. "+t.title+" 끝났습니다"); draw();
}

function alPlan(){
  var r=cur(), al=D.submit.alarm||{}, o=[];
  var sd=D.submit.date||(r?r.deadline:"");
  if(sd&&al.sub)    o.push(kor(sd)+" 아침 9시 · 제출 알림");
  if(sd&&al.subCal) o.push(kor(sd)+" · 캘린더 일정 [보정서 제출] "+D.case.case_no);
  if(r&&r.mode!=="fact"&&r.promise){
    var b=biz(r.promise), warn=addDays(b,-3);
    if(al.next)    o.push(kor(warn)+" 아침 9시 · 다음 약속일 3일 전 알림");
    if(al.nextCal) o.push(kor(b)+" · 캘린더 일정 [추후제출 기한] "
      +(b!==r.promise?"(문서에는 "+kor(r.promise)+", 공휴일이라 일정은 다음 평일)":""));
  }
  if(r&&r.mode==="fact") o.push((r.fact_note||"회신")+"이 오면 그때 날짜를 정합니다. 지금은 일정이 안 잡힙니다");

function downIcs(){
  var r=cur(), al=D.submit.alarm||{}, ev=[];
  function push(dt,title){
    if(!dt) return;
    var d=dt.replace(/-/g,"");
    ev.push("BEGIN:VEVENT\nDTSTART;VALUE=DATE:"+d+"\nSUMMARY:"+title+"\nEND:VEVENT");
  }
  var sd=D.submit.date||(r?r.deadline:"");
  if(al.subCal) push(sd,"[보정서 제출] "+D.case.case_no+" "+D.case.debtor);
  if(al.nextCal&&r&&r.mode!=="fact"&&r.promise) push(biz(r.promise),"[추후제출 기한] "+D.case.case_no+" "+D.case.debtor);
  if(!ev.length){ toast("캘린더에 넣을 일정이 없습니다"); return; }
  var ics="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//bojeong//KR\n"+ev.join("\n")+"\nEND:VCALENDAR";
  /* 미리보기 화면에서는 파일 내려받기가 막혀 있다. 실제 앱에서는 .ics 파일로 저장된다 */
  copy(ics, "일정 내용을 복사했습니다. 메모장에 붙여 .ics 로 저장하면 캘린더에 들어갑니다");

/* ==========================================================
   저장 (2026-08-31)
   이 브라우저 안에 남깁니다. 메모·체크·파일 원본까지 그대로 되살아납니다.
   파일은 IndexedDB 에 통째로 넣습니다. 새로고침해도 [보기]가 그대로 됩니다.
   ========================================================== */
var DBP=null, saveT=null, savedAt="", saveErr="";
function db(){
  if(DBP)return DBP;
  DBP=new Promise(function(res,rej){
    var r=indexedDB.open("bojeong-cheoridae",1);
    r.onupgradeneeded=function(){
      var d=r.result;
      if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("files"))d.createObjectStore("files");
    };
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
  return DBP;
}
function idbPut(st,k,v){return db().then(function(d){return new Promise(function(res,rej){
  var t=d.transaction(st,"readwrite"); t.objectStore(st).put(v,k);
  t.oncomplete=function(){res();}; t.onerror=function(){rej(t.error);};});});}
function idbGet(st,k){return db().then(function(d){return new Promise(function(res,rej){
  var t=d.transaction(st,"readonly"), q=t.objectStore(st).get(k);
  q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);};});});}
function idbDel(st,k){return db().then(function(d){return new Promise(function(res){
  var t=d.transaction(st,"readwrite"); t.objectStore(st).delete(k);
  t.oncomplete=function(){res();}; t.onerror=function(){res();};});});}
function idbWipe(){return db().then(function(d){return new Promise(function(res){
  var t=d.transaction(["kv","files"],"readwrite");
  t.objectStore("kv").clear(); t.objectStore("files").clear();
  t.oncomplete=function(){res();}; t.onerror=function(){res();};});});}

/* 저장 표시를 바꿔 준다 */
function saveDot(txt,cls){
  var e=document.getElementById("savedot");

}
function markSave(){ clearTimeout(saveT); saveT=setTimeout(doSave,500); }
function doSave(){
  var copy;
  try{ copy=JSON.parse(JSON.stringify(D,function(k,v){ return k==="url"?undefined:v; })); }
  catch(e){ saveErr="복사 실패"; saveDot("저장 실패","r"); return; }
  saveDot("저장 중","");
  idbPut("kv","state",copy).then(function(){
    savedAt=new Date().toTimeString().slice(0,5); saveErr="";
    if(!cloudOn||!wbCase()){ wbSaveState="local"; saveDot("이 브라우저에만 저장됨 "+savedAt,"a"); return; }
    saveDot("회사 서버에 저장 중","");
    cloudSave(copy).then(function(){
      cloudErr=""; wbSaveState="server";
      saveDot("회사 서버에 저장됨 "+savedAt,"g");
    }).catch(function(e){
      cloudErr=(e&&e.message)||String(e); wbSaveState="local";
      saveDot("이 브라우저에만 저장됨 "+savedAt,"a");
    });
  }).catch(function(){ saveErr="저장 실패"; saveDot("저장 실패","r"); });
}
/* 저장해 둔 파일을 다시 볼 수 있게 되살린다 */
function rehydrate(){
  var jobs=[];
  /* 이 브라우저에 원본이 있으면 그것으로, 없으면 회사 보관함에서 주소를 받아 온다 */
  function revive(f){
    if(!f)return;
    jobs.push(
      (f.fid?idbGet("files",f.fid):Promise.resolve(null)).then(function(b){
        if(b){ try{ f.url=URL.createObjectURL(b); return; }catch(e){} }
        if(f.spath)return cloudFileUrl(f.spath).then(function(u){ if(u)f.url=u; });
      }).catch(function(){})
    );
  }
  (D.tasks||[]).forEach(function(t){ (t.files||[]).forEach(revive); });
  MATS().forEach(function(a){ (a.mat.files||[]).forEach(revive); });
  return Promise.all(jobs);
}
function boot(){
  draw();
  var localState=null;
  idbGet("kv","state").then(function(st){
    if(st&&st.tasks&&st["case"])localState=st;
    if(localState){ D=localState; openHang={}; openRound={}; openTask=null; justNew={}; notice=null; peekAt=null; }
    var no=wbCase();
    if(!cloudOn||!no)return null;
    /* ★서버에 더 최근 것이 있으면 그것으로 연다. 회사 컴퓨터와 집 컴퓨터가 어긋나지 않게 */
    return cloudLoad(no).then(function(got){
      if(got&&got.state){
        D=got.state; openHang={}; openRound={}; openTask=null; justNew={}; notice=null; peekAt=null;
        return {from:"서버",at:String(got.updated_at||"").slice(0,10)};
      }
      return null;
    }).catch(function(){ return null; });
  }).then(function(src){
    return rehydrate().then(function(){ return src; });
  }).then(function(src){
    if(!wbCase()&&cloudOn){ goHome(); }
    else draw();
    if(src&&src.from==="서버")saveDot("회사 서버에서 불러옴 "+src.at,"g");
    else if(localState)saveDot(cloudOn?"이 브라우저에서 불러옴":"저장된 것 불러옴","g");
    else saveDot(cloudOn?"회사 서버에 연결됨":"저장 안 됨","");
  }).catch(function(){ saveDot("저장 안 됨",""); });
}
function wipeSave(){
  if(!confirm("이 브라우저에 저장해 둔 것을 지웁니다.\n\n메모, 체크, 올린 파일이 전부 사라지고 처음 상태로 돌아갑니다.\n되돌릴 수 없습니다. 계속할까요?"))return;
  idbWipe().then(function(){ location.reload(); });
}

/* ==========================================================
   작업 파일 (2026-08-31)
   「받을 자료」가 정해지지 않은 할 일에는 파일 상자가 아예 안 붙었다.

function taskFileBox(t){
  var fs=t.files||[];

   +   '<span class="sp"></span>'

   + '</div>'
   + '<div class="dz" ondragover="dzOver(event,1)" ondragenter="dzOver(event,1)" ondragleave="dzOver(event,0)"'
   +   ' ondrop="dzDrop(event,\'task\',\''+t.id+'\')" onclick="dzClick(event,\'tf_'+t.id+'\')">'
   + '<div class="dzin">'
   +   '<b>파일을 여기에 끌어다 놓으세요</b>'
   +   '<span class="dim">또는 아무 데나 눌러서 고르기 · 여러 개 한꺼번에 됩니다</span>'
   + '</div>'
   + (fs.length?'<div class="dzfiles">'+fs.map(function(f,i){
        return '<span class="fchip">'
         + (f.url?'<a href="'+f.url+'" target="_blank" rel="noopener" title="새 창으로 열어보기">'+esc(f.name)+'</a>':esc(f.name))
         + ' <span class="dim m">'+kb(f.size)+'</span>'
         + (f.url?'<button onclick="peekT(\''+t.id+'\','+i+')" class="v" title="여기서 보기">보기</button>':'')
         + '<button onclick="delTF(\''+t.id+'\','+i+')" class="x" title="빼기">×</button></span>';
      }).join("")+'</div>':'')
   + '<label class="b o dzbtn" style="cursor:pointer;width:auto;height:38px;padding:0 16px">파일 고르기'
   + '<input id="tf_'+t.id+'" type="file" multiple hidden onchange="addTF(\''+t.id+'\',this)"></label>'
   + '</div></div></div>';
  return h;
}
function addTF(id,inp){
  var t=T(id); if(!t)return;
  if(!t.files)t.files=[];
  var jobs=[];
  for(var i=0;i<inp.files.length;i++){
    var f=inp.files[i], u="";
    var fid="f"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
    try{ u=URL.createObjectURL(f); }catch(e){}
    var _e2={name:f.name,size:f.size,url:u,type:f.type||"",fid:fid,at:new Date().toISOString()};
    t.files.push(_e2);
    jobs.push(idbPut("files",fid,f));
    jobs.push(cloudPutFile(f,fid).then(function(p){ if(p)_e2.spath=p; }).catch(function(){}));
  }
  Promise.all(jobs).then(function(){ markSave(); toast("파일 "+inp.files.length+"개를 붙였습니다"); })
    .catch(function(){ toast("파일을 저장하지 못했습니다. 이름만 남습니다"); saveDot("파일 저장 실패","r"); });
  draw();
}
function delTF(id,i){
  var t=T(id); if(!t||!t.files)return;
  var f=t.files[i];
  if(f&&f.fid)idbDel("files",f.fid);
  if(f&&f.url){try{URL.revokeObjectURL(f.url);}catch(e){}}
  t.files.splice(i,1); markSave(); draw();
}
function peekT(id,i){ peekAt=(peekAt&&peekAt.tid===id&&peekAt.i===i)?null:{tid:id,i:i}; draw(); }

/* 끌어다 놓기 (2026-08-31) : 파일은 끌어놔도, 눌러서 골라도 들어갑니다 */
function dzOver(e,on){ e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.toggle("over",!!on); }
function dzDrop(e,kind,id){
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.classList.remove("over");
  var fl=e.dataTransfer&&e.dataTransfer.files;
  if(!fl||!fl.length){ toast("파일을 못 읽었습니다"); return; }
  if(kind==="task") addTF(id,{files:fl}); else addF(id,{files:fl});
}
/* 상자 아무 데나 눌러도 파일 고르기가 열립니다. 단추와 파일 이름은 빼고 */
function dzClick(e,inputId){
  var t=e.target;
  if(t.closest("button")||t.closest("a")||t.closest("label"))return;
  var i=document.getElementById(inputId); if(i)i.click();
}

   서류함 (2026-08-31)
   들어온 파일을 한 곳에서 확인합니다.
   문항별 · 담당별 · 상태별로 갈아 볼 수 있고, 방금 들어온 것이 맨 위에 뜹니다.
   ========================================================== */
var dbMode="문항별", dbQ="";
function dbSet(k,v){ if(k==="mode")dbMode=v; else dbQ=v; draw(); }
function allFiles(){
  var o=[];
  MATS().forEach(function(a){
    (a.mat.files||[]).forEach(function(f,i){
      o.push({f:f,i:i,where:a.key,kind:"mat",key:a.key,owner:(a.task&&a.task.owner)||"",hang:(a.task&&a.task.hang)||""});
    });
  });
  (D.tasks||[]).forEach(function(t){
    (t.files||[]).forEach(function(f,i){
      o.push({f:f,i:i,where:t.title,kind:"task",key:t.id,owner:t.owner||"",hang:t.hang||""});
    });
  });
  o.sort(function(x,y){ return String(y.f.at||"").localeCompare(String(x.f.at||"")); });
  return o;
}

   + (f.url?'<button onclick="'+(r.kind==="task"?'peekT(\''+r.key+'\','+r.i+')':'peek(\''+esc(r.key)+'\','+r.i+')')+'" class="v" title="여기서 보기">보기</button>':'')
   + '<button onclick="'+(r.kind==="task"?'delTF(\''+r.key+'\','+r.i+')':'delF(\''+esc(r.key)+'\','+r.i+')')+'" class="x" title="빼기">×</button></span>';

/* 자료 한 줄 */
function matRow(a){
  var ok=full(a), fs=a.mat.files||[], hs=matHangs(a.key);
  var q=dbQ.replace(/\s/g,"");
  if(q && (a.key+(a.task&&a.task.title||"")).replace(/\s/g,"").indexOf(q)<0) return "";
  var h='<div class="mrow'+(ok?" full":"")+'">'
   + '<span class="ck '+(ok?"on":"")+'">'+(ok?"✓":"")+'</span>'
   + '<div style="flex:1;min-width:0">'
   +   '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">'
   +     '<b>'+esc(a.key)+'</b><span class="tag '+(ok?"g":"y")+'">'+esc(a.ty)+'</span>'
   +     '<span class="tag">'+esc((a.task&&a.task.owner)||"")+'</span>'
   +     (hs.length?'<span class="tag p">'+hs.map(function(x){return "보정권고"+x.court_no+"항";}).join(" · ")+'</span>':'')
   +     '<span class="sp"></span>'
   +     '<span class="dim m">파일 '+fs.length+'개</span>'
   +   '</div>'
   +   '<div class="dim">'+esc((a.task&&a.task.title)||"")+(ok?"":' · '+lack(a).join("과 ")+' 이(가) 없습니다')+'</div>'
   +   (fs.length?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">'
        +fs.map(function(f,i){return fileChip({f:f,i:i,kind:"mat",key:a.key});}).join("")+'</div>':'')
   +   '<div class="dz" style="margin-top:8px;padding:10px" ondragover="dzOver(event,1)" ondragenter="dzOver(event,1)" ondragleave="dzOver(event,0)"'
   +     ' ondrop="dzDrop(event,\'mat\',\''+esc(a.key)+'\')" onclick="dzClick(event,\'db_'+cid(a.key)+'\')">'
   +     '<div class="dzin"><b style="font-size:12.5px">여기에 끌어다 놓거나 눌러서 넣기</b></div>'
   +     '<input id="db_'+cid(a.key)+'" type="file" multiple hidden onchange="addF(\''+esc(a.key)+'\',this)"></div>'
   + '</div></div>';
  return h;
}
function dbGroup(title,sub,list){
  if(!list.length)return "";
  var rows=list.map(matRow).join("");
  if(!rows.trim())return "";
  var ok=list.filter(full).length;
  return '<div class="secttl"><h2>'+esc(title)+'</h2>'
   + '<span class="tag '+(ok===list.length?"g":"y")+'">'+ok+' / '+list.length+' 확보</span>'
   + (sub?'<span class="dim">'+esc(sub)+'</span>':'')+'</div>'
   + '<div class="card"><div class="rows">'+rows+'</div></div>';
}
function viewDocs(){
  var mats=MATS(), files=allFiles();
  var todayF=files.filter(function(r){return isToday(r.f);});
  var h='<div class="secttl"><h2>서류함</h2>'
   + '<span class="dim">들어온 파일을 여기서 한 번에 확인합니다</span></div>'
   + '<div class="grid3">'
   + '<div class="card"><div class="pad"><span class="cap">모아야 할 자료</span><div class="fig">'+mats.length+'<span class="figu">개</span></div></div></div>'
   + '<div class="card"><div class="pad"><span class="cap">확보</span><div class="fig" style="color:hsl(var(--ok))">'+mats.filter(full).length+'<span class="figu">개</span></div></div></div>'
   + '<div class="card"><div class="pad"><span class="cap">아직 대기</span><div class="fig" style="color:hsl(var(--warn))">'+mats.filter(function(a){return !full(a);}).length+'<span class="figu">개</span></div></div></div>'
   + '<div class="card"><div class="pad"><span class="cap">들어온 파일</span><div class="fig">'+files.length+'<span class="figu">개</span></div></div></div>'
   + '</div>';

  /* 오늘 들어온 것 */
  if(todayF.length){
    h+='<div class="notice" style="margin-top:16px"><b>오늘 들어온 파일 '+todayF.length+'개</b>'
     + '<span class="dim">'+todayF.slice(0,3).map(function(r){return esc(r.f.name);}).join(" · ")+(todayF.length>3?' 외 '+(todayF.length-3)+'개':'')+'</span>'
     + '<span class="sp"></span><span class="tag g">방금 확인하세요</span></div>';
  }

  /* 도구줄 */
  h+='<div class="card" style="margin-top:14px"><div class="pad" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">'
   + '<span class="cap">묶는 기준</span><div class="seg">'
   + ["문항별","담당별","상태별"].map(function(x){
       return '<button class="'+(dbMode===x?"on":"")+'" onclick="dbSet(\'mode\',\''+x+'\')">'+x+'</button>';}).join("")
   + '</div>'
   + '<input class="in" style="flex:1;min-width:200px" placeholder="자료 이름이나 할 일로 찾기" value="'+esc(dbQ)+'" oninput="dbQ=this.value;clearTimeout(window.__dbt);window.__dbt=setTimeout(draw,250)">'
   + '<span class="dim">'+(dbMode==="문항별"?"법원 문항에 붙은 자료끼리":dbMode==="담당별"?"누가 가져오는 자료인지로":"확보와 대기로")+' 묶었습니다</span>'
   + '</div></div>';

  /* 묶어서 보여주기 */
  if(dbMode==="문항별"){
    var used={};
    (D.hangs||[]).forEach(function(x,hi){
      var l=hMats(x); l.forEach(function(a){used[a.key]=1;});
      h+=hangDocCard(x,hi,l);
    });
    var etc=mats.filter(function(a){return !used[a.key];});
    h+=dbGroup("문항에 안 붙은 자료","어느 항에 쓸지 아직 정해지지 않았습니다",etc);
  } else if(dbMode==="담당별"){
    ["당사자","사무실","공동"].forEach(function(o){
      h+=dbGroup(o==="당사자"?"당사자에게 받는 것":(o==="사무실"?"우리가 뽑거나 만드는 것":"같이 만드는 것"),"",
                 mats.filter(function(a){return (a.task&&a.task.owner)===o;}));
    });
  } else {
    h+=dbGroup("아직 대기","이것들이 들어와야 다음 일이 풀립니다",mats.filter(function(a){return !full(a);}));
    h+=dbGroup("확보","다 받았습니다",mats.filter(full));
  }

  /* 파일 전부 */
  h+='<div class="secttl"><h2>이 사건 파일 전부</h2><span class="tag">'+files.length+'개</span>'
   + '<span class="dim">최근에 넣은 것이 위입니다</span></div>'
   + '<div class="card"><div class="rows">'
   + (files.length ? files.map(function(r){
       return '<div class="mrow'+(isToday(r.f)?" full":"")+'">'
        + '<span class="tag '+(isToday(r.f)?"g":"")+'">'+(isToday(r.f)?"오늘":(String(r.f.at||"").slice(5,10)||"이전"))+'</span>'
        + '<div style="flex:1;min-width:0"><b>'+esc(r.f.name)+'</b>'
        + '<div class="dim">'+esc(r.where)+(r.hang?' · '+esc(r.hang):'')+(r.owner?' · '+esc(r.owner):'')+' · '+kb(r.f.size)+'</div></div>'
        + fileChip(r) + '</div>';
     }).join("") : '<div class="empty">아직 들어온 파일이 없습니다</div>')
   + '</div></div>';
  return h;
}

/* ==========================================================
   문항별 서류 카드 (2026-08-31)
   파일을 넣으면 그 보정권고 문항이 몇 개 채워졌는지 바로 보입니다.
   다 차면 "이 항은 이제 낼 수 있습니다" 로 바뀝니다.
   ========================================================== */
var hdOpen={};
function hdTg(i){ hdOpen[i]=!hdOpen[i]; draw(); }
function hangDocCard(x,hi,list){
  var q=dbQ.replace(/\s/g,"");
  if(q){
    var hit=list.some(function(a){return (a.key+((a.task&&a.task.title)||"")).replace(/\s/g,"").indexOf(q)>=0;})
          || String((x.title||"")+(x.court||"")).replace(/\s/g,"").indexOf(q)>=0;
    if(!hit)return "";
  }
  var ok=list.filter(full).length, n=list.length, done=n>0&&ok===n;
  var open = hdOpen[hi]!==undefined ? hdOpen[hi] : !done;   /* 다 찬 항은 접어 둡니다 */
  var p=n?Math.round(ok/n*100):0;
  var h='<div class="card" style="margin-top:14px'+(done?';border:1px solid hsl(var(--ok)/.4)':'')+'">'
   + '<button class="hrow" style="width:100%" onclick="hdTg('+hi+')">'
   +   '<span class="hno'+(done?" ok":"")+'" style="'+(done?'background:hsl(var(--ok));border-color:hsl(var(--ok));color:hsl(var(--card))':'')+'">'+(done?"✓":"")+'</span>'
   +   '<span class="tag m">보정권고'+esc(x.court_no||"")+'항</span>'
   +   '<b style="flex:1;min-width:0;font-size:14px">'+esc(x.title||"")+'</b>'
   +   '<span class="dim m">'+ok+' / '+n+'</span>'
   +   '<span class="tag '+(done?"g":"y")+'">'+(done?"낼 수 있습니다":(n-ok)+"개 남음")+'</span>'
   + '</button>'
   + '<div style="padding:0 16px 4px"><div class="bar-p '+(done?"":(p>0?"y":"r"))+'"><i style="width:'+p+'%"></i></div></div>';
  if(open){
    h+='<div class="pad" style="padding-top:12px">';
    if(x.court)h+='<div class="needbox" style="margin:0 0 12px"><span class="cap">법원이 요구한 것</span>'
      +'<p style="margin:7px 0 0;line-height:1.9;font-size:13px">'+esc(x.court)+'</p></div>';
    h+= n ? '<div class="rows" style="border:1px solid hsl(var(--line));border-radius:var(--rs)">'
            + list.map(function(a){return hangMatRow(a,x);}).join("") + '</div>'
          : '<div class="empty">이 항에 붙은 자료가 없습니다</div>';
    if(done)h+='<div class="needbox ok" style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      +'<b>이 항은 이제 낼 수 있습니다.</b><span class="dim">보정서에서 골라 넣으면 됩니다</span>'
      +'<span class="sp" style="flex:1"></span><button class="b p s" onclick="go(\'doc\')">보정서에서 고르기</button></div>';
    else h+='<div class="needbox wait" style="margin-top:12px"><b>'+(n-ok)+'개가 더 있어야 이 항을 낼 수 있습니다.</b> '
      +'<span class="dim">'+list.filter(function(a){return !full(a);}).map(function(a){return esc(a.key);}).join(" · ")+'</span></div>';
    h+='</div>';
  }
  return h+'</div>';
}
/* 항 안에서 보는 자료 한 줄. 파일이 없을 때만 넣는 자리를 크게 폅니다 */
function hangMatRow(a,x){
  var ok=full(a), fs=a.mat.files||[], id=cid(a.key)+"_h"+(x.court_no||"");
  var h='<div class="mrow'+(ok?" full":"")+'" style="align-items:flex-start">'
   + '<span class="ck '+(ok?"on":"")+'">'+(ok?"✓":"")+'</span>'
   + '<div style="flex:1;min-width:0">'
   +   '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">'
   +     '<b>'+esc(a.key)+'</b>'
   +     '<span class="tag '+(ok?"g":"y")+'">'+esc(a.ty)+'</span>'
   +     '<span class="tag">'+esc((a.task&&a.task.owner)||"")+'</span>'
   +     '<span class="sp" style="flex:1"></span>'
   +     '<span class="dim m">'+(fs.length?"파일 "+fs.length+"개":"파일 없음")+'</span>'
   +   '</div>'
   +   '<div class="dim">'+esc((a.task&&a.task.title)||"")+'</div>';
  if(fs.length){
    h+='<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center">'
     + fs.map(function(f,i){return fileChip({f:f,i:i,kind:"mat",key:a.key});}).join("")
     + '<label class="b g s" style="cursor:pointer">＋ 더 넣기'
     + '<input id="hd_'+id+'" type="file" multiple hidden onchange="addF(\''+esc(a.key)+'\',this)"></label>'
     + '</div>';
  }else{
    h+='<div class="dz" style="margin-top:8px;padding:11px" ondragover="dzOver(event,1)" ondragenter="dzOver(event,1)" ondragleave="dzOver(event,0)"'
     + ' ondrop="dzDrop(event,\'mat\',\''+esc(a.key)+'\')" onclick="dzClick(event,\'hd_'+id+'\')">'
     + '<div class="dzin"><b style="font-size:12.5px">여기에 끌어다 놓거나 눌러서 넣기</b>'
     + '<span class="dim">넣으면 이 항이 '+esc(String((x.court_no||""))) +'항 채움에 바로 반영됩니다</span></div>'
     + '<input id="hd_'+id+'" type="file" multiple hidden onchange="addF(\''+esc(a.key)+'\',this)"></div>';
  }
  return h+'</div></div>';
}

/* ==========================================================
   직원 현황 (2026-08-31)
   누구에게 무엇을 맡겼는지 한눈에 보고, 그 사람 화면을 그대로 열어 봅니다.
   ========================================================== */
var STAFF_NAMES=["김알바","박알바","이알바","최알바"];
function staffTasks(n){ return D.tasks.filter(function(t){return t.assignee===n;}); }
function staffCard(n){
  var l=staffTasks(n);
  var dn=l.filter(isDone).length;
  var rd=l.filter(ready).length;
  var wt=l.filter(function(t){return !isDone(t)&&!ready(t);}).length;
  var on=(role==="직원"&&who===n);
  var h='<div class="stfc'+(on?" on":"")+'">'
   + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
   +   '<h4>'+esc(n)+'</h4>'
   +   (l.length?'<span class="tag '+(rd?"g":(wt?"y":""))+'">'+(rd?"지금 "+rd+"건 가능":(wt?"자료 대기 "+wt+"건":"다 끝냈습니다"))+'</span>'
               :'<span class="tag">맡은 일 없음</span>')
   +   '<span class="sp" style="flex:1"></span>'
   +   '<button class="b '+(on?"p":"o")+' s" onclick="seeAs(\''+n+'\')">'+(on?"보는 중":"이 사람 화면 보기")+'</button>'
   + '</div>'
   + '<div class="kv"><span>맡은 일<b>'+l.length+'</b></span>'
   +   '<span>지금 가능<b style="color:hsl(var(--ok))">'+rd+'</b></span>'
   +   '<span>자료 대기<b style="color:hsl(var(--warn))">'+wt+'</b></span>'
   +   '<span>끝냄<b>'+dn+'</b></span></div>'
   + '<div class="bar-p '+(rd?"":"y")+'" style="margin-top:9px"><i style="width:'+pct(dn,l.length||1)+'%"></i></div>';
  if(l.length){
    h+='<div class="stflist">'+l.slice(0,8).map(function(t){
      var cls=isDone(t)?"done":(ready(t)?"now":"wait");
      return '<div class="l '+cls+'"><span class="dot2"></span>'
       + '<span style="flex:1;min-width:0"><b>'+esc(t.title)+'</b>'
       + '<span class="dim"> · '+esc(t.hang||"")+' · '+esc(t.station_name||"")+'</span>'
       + (cls==="wait"?'<div class="dim">'+ (miss(t).length?miss(t).join(" · ")+" 이(가) 와야 시작":"앞선 일이 끝나야 시작") +'</div>':'')
       + '</span></div>';
    }).join("")
    + (l.length>8?'<div class="dim" style="padding-top:6px">외 '+(l.length-8)+'건</div>':'')
    + '</div>';
  }
  return h+'</div>';
}
function seeAs(n){
  role="직원"; who=n; view="today";
  draw(); window.scrollTo({top:0,behavior:"smooth"});
  toast(n+" 님 화면으로 보고 있습니다");
}
function backAdmin(){ role="관리자"; who="전체"; view="board"; draw(); window.scrollTo({top:0,behavior:"smooth"}); }
function staffPanel(){
  var un=D.tasks.filter(function(t){return !t.assignee&&!isDone(t);}).length;
  return '<div class="secttl"><h2>직원 현황</h2>'
   + '<span class="tag '+(un?"y":"g")+'">'+(un?"담당자 없는 일 "+un+"건":"전부 배분됨")+'</span>'
   + '<span class="dim">누구에게 무엇을 맡겼는지 보고, 그 사람 화면을 그대로 열어 볼 수 있습니다</span></div>'
   + '<div class="stf">'+STAFF_NAMES.map(staffCard).join("")+'</div>'
   + (un?'<div class="needbox wait" style="margin-top:12px"><b>담당자가 없는 일이 '+un+'건 있습니다.</b> '
       +'<span class="dim">아래 배분판에서 카드를 눌러 담당자를 정해 주세요.</span></div>':'');
}

/* ==========================================================
   08 보정권고 넣기에서 가져온 화면 5개
   보정권고 넣기 · 받을 것 · 우리가 할 것 · 요청 카톡 · 서류 이름
   디자인과 부품은 보정 처리대 것을 그대로 씁니다
   ========================================================== */

/* ---------- 보정권고 넣기 ---------- */
var inStep=1, inRaw="", inPrompt="";
function inGo(n){ inStep=n; draw(); window.scrollTo({top:0,behavior:"smooth"}); }
function viewIntake(){
  var steps=[["보정권고 넣기","원문을 붙여넣고 변환 프롬프트를 받습니다"],
             ["JSON 붙여넣기","클로드가 만든 결과를 넣고 검사합니다"],
             ["확인하고 서류 이름 정하기","읽은 내용과 서류 이름을 확인한 뒤 사건에 넣습니다"]];
  var rail='<aside class="card"><div class="pad" style="padding:10px">'
   + steps.map(function(x,i){
       var on=inStep===i+1, done=inStep>i+1;
       return '<button class="hrow'+(on?" sel":"")+(done?" ok":"")+'" style="border-radius:var(--rs)" onclick="inGo('+(i+1)+')">'
        +'<span class="hno">'+(done?"✓":(i+1))+'</span>'
        +'<span style="flex:1;min-width:0"><b style="font-size:13.5px">'+x[0]+'</b>'
        +'<div class="dim" style="font-size:12px">'+x[1]+'</div></span></button>';
     }).join("")
   + '</div></aside>';
  var panel="";
  if(inStep===1){
    panel='<section class="card"><div class="hd"><h3>법원 보정권고 원문</h3><span class="sp"></span>'
     +'<span class="dim m">'+inRaw.length.toLocaleString()+'자</span></div><div class="pad">'
     +'<textarea class="in" id="inraw" spellcheck="false" style="min-height:320px" '
     +'oninput="inRaw=this.value" placeholder="전자소송에서 받은 보정권고 원문을 그대로 붙여넣으세요">'+esc(inRaw)+'</textarea>'
     +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
     +'<button class="b p" onclick="mkPrompt()">변환 프롬프트 만들기</button>'
     +'<button class="b o" onclick="inGo(2)">이미 JSON이 있어요</button></div>';
    if(inPrompt){
      panel+='<div class="needbox" style="margin-top:14px">'
       +'<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:hsl(var(--mutf))">'
       +'<span class="tag">① 프롬프트 복사</span><span>→</span><span class="tag">② 클로드에 붙여넣기</span>'
       +'<span>→</span><span class="tag">③ 나온 JSON을 2단계에</span></div>'
       +'<textarea class="in m" id="inprompt" readonly style="min-height:240px;font-size:12px;line-height:1.75;margin-top:10px">'+esc(inPrompt)+'</textarea>'
       +'<button class="b p" style="margin-top:10px" onclick="copy(inPrompt,\'프롬프트를 복사했습니다\')">프롬프트 복사</button></div>';
    }
    panel+='</div></section>';
  }
  if(inStep===2){
    panel='<section class="card"><div class="hd"><h3>클로드가 만든 JSON</h3><span class="sp"></span>'
     +'<span class="dim">앞뒤에 설명이 붙어 있어도 됩니다</span></div><div class="pad">'
     +'<textarea class="in" id="jsonta" spellcheck="false" style="min-height:320px;font-family:var(--fm);font-size:12.5px" '
     +'placeholder="중괄호로 시작해 중괄호로 끝나는 JSON을 붙여넣으세요"></textarea>'
     +'<div id="jerr"></div>'
     +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'

 {g:"의뢰인",n:["은행거래내역서","예상해약환급금확인서","자동차보험증권","카드 사용내역서","급여명세서","근로계약서","임대차계약서","건강보험 자격득실확인서","가족관계증명서","주민등록등본","이체확인증","완납영수증","퇴직금 추정액 확인서","보험증권"]},

];
var DICTST={};   /* 자료 이름 -> {st, hit, mode} */
function dNorm(s){return String(s||"").replace(/\s|\(.*?\)/g,"");}
function dFind(name){
  var q=dNorm(name), best=null;
  DICT.forEach(function(d){ d.n.forEach(function(n){
    var k=dNorm(n);
    if(k===q){ best={n:n,g:d.g,kind:"대표"}; return; }
    if(!best&&(k.indexOf(q)>=0||q.indexOf(k)>=0)&&k.length>2) best={n:n,g:d.g,kind:"비슷"};
  });});
  return best;
}
function dictRows(){
  var seen={}, out=[];
  MATS().forEach(function(a){ if(seen[a.key])return; seen[a.key]=1; out.push(a.key); });
  return out;
}
function dictLeft(){
  return dictRows().filter(function(k){
    var st=DICTST[k]; if(st&&st.st)return false;
    var f=dFind(k); return !f||f.kind==="비슷";
  }).length;
}

    body='<div class="dim"><span class="tag y">비슷</span> 사전에서 찾은 것 · <b>'+esc(f.n)+'</b> · '+esc(f.g)+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
      +'<button class="b p s" onclick="dOk(\''+esc(k)+'\')">맞음</button>'
      +'<button class="b o s" onclick="dMode(\''+esc(k)+'\',\'find\')">유형표에서 찾기</button>'
      +'<button class="b g s" onclick="dMode(\''+esc(k)+'\',\'add\')">새 이름으로 등록</button></div>';
  else
    body='<div class="dim"><span class="tag r">없음</span> 사전에 없는 이름입니다</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
      +'<button class="b p s" onclick="dMode(\''+esc(k)+'\',\'add\')">이 이름으로 사전에 추가</button>'
      +'<button class="b o s" onclick="dMode(\''+esc(k)+'\',\'find\')">유형표에서 찾기</button></div>';
  if(st.mode==="find")
    open='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:flex-start">'
      +'<div style="position:relative;flex:1;min-width:220px">'
      +'<input class="in" id="dq_'+id+'" placeholder="서류 이름을 쳐서 찾으세요" oninput="dSearch(\''+esc(k)+'\',this.value)">'
      +'<div id="dl_'+id+'" style="position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:230px;overflow:auto;'
      +'background:hsl(var(--card));border:1px solid hsl(var(--line2));border-radius:var(--rs);box-shadow:0 10px 26px hsl(24 12% 11%/.14)"></div></div>'
      +'<button class="b g s" onclick="dMode(\''+esc(k)+'\',\'\')">닫기</button></div>';
  if(st.mode==="add")
    open='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">'
      +'<input class="in" style="flex:1;min-width:200px" id="da_'+id+'" value="'+esc(k)+'" placeholder="사전에 넣을 이름">'
      +'<select class="in" style="width:auto" id="dg_'+id+'"><option>의뢰인</option><option>사무실</option><option>회사작성</option></select>'
      +'<button class="b p s" onclick="dAdd(\''+esc(k)+'\')">사전에 넣기</button>'
      +'<button class="b g s" onclick="dMode(\''+esc(k)+'\',\'\')">닫기</button></div>';
  return '<div class="mrow'+(st.st?" full":"")+'"><span class="ck '+(st.st?"on":"")+'">'+(st.st?"✓":"")+'</span>'
   +'<div style="flex:1"><b>'+esc(k)+'</b>'+body+open+'</div></div>';
}
function dSt(k){ DICTST[k]=DICTST[k]||{}; return DICTST[k]; }
function dOk(k){ var s=dSt(k); var f=dFind(k); s.st="ok"; s.hit=f?f.n:k; s.mode=""; draw(); toast("확인했습니다"); }
function dMode(k,m){ var s=dSt(k); s.mode=m; draw();
  if(m)setTimeout(function(){var e=document.getElementById((m==="find"?"dq_":"da_")+cid(k));if(e)e.focus();},30); }
function dAdd(k){
  var v=(document.getElementById("da_"+cid(k)).value||"").trim();
  if(!v){ toast("이름을 적어 주세요"); return; }
  var g=document.getElementById("dg_"+cid(k)).value;
  DICT.forEach(function(d){ if(d.g===g&&d.n.indexOf(v)<0)d.n.push(v); });
  var s=dSt(k); s.st="add"; s.hit=v; s.mode=""; draw(); toast("사전 "+g+" 칸에 넣었습니다");
}
function dSearch(k,q){
  q=dNorm(q);
  var box=document.getElementById("dl_"+cid(k)), h="";
  DICT.forEach(function(d){
    var hit=d.n.filter(function(n){ return !q||dNorm(n).indexOf(q)>=0; });
    if(!hit.length)return;
    h+='<div style="padding:7px 12px 3px;font-size:11px;font-weight:800;letter-spacing:.08em;color:hsl(var(--mutf))">'+d.g+'</div>'
     + hit.map(function(n){
        return '<button style="display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;font-size:13px" '
         +'onclick="dPick(\''+esc(k)+'\',\''+esc(n)+'\')">'+esc(n)+'</button>';}).join("");
  });
  box.innerHTML=h||'<div style="padding:10px 12px;font-size:12.5px;color:hsl(var(--mutf))">찾는 이름이 없습니다. 새 이름으로 등록해 주세요</div>';
}
function dPick(k,n){ var s=dSt(k); s.st="ok"; s.hit=n; s.mode=""; draw(); toast(n+" 으로 이어 붙였습니다"); }


boot();

</script>

</body>
</html>
